name: Build Voa iOS game on macOS
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Download source
        uses: actions/checkout@v6
      - name: Create native game and tests
        run: |
          mkdir -p HelloWindows
          cat > HelloWindows/HelloWindowsApp.swift <<'VOA_FILE_0'
          import Foundation
          
          // Shared by the SpriteKit game and the deterministic command-line smoke tests.
          enum FlightMath {
              static func speed(score: Int) -> Double {
                  172 + Double(min(max(score, 0), 18)) * 4
              }
          
              static func gap(score: Int) -> Double {
                  186 - Double(min(max(score, 0), 20)) * 1.3
              }
          
              static func integrate(y: Double, velocity: Double, dt: Double, scale: Double) -> (y: Double, velocity: Double) {
                  let gravity = 1_000 * scale
                  return (y + velocity * dt - 0.5 * gravity * dt * dt, velocity - gravity * dt)
              }
          
              static func circleHitsRect(x: Double, y: Double, radius: Double,
                                         minX: Double, minY: Double, width: Double, height: Double) -> Bool {
                  guard width > 0, height > 0 else { return false }
                  let dx = x - min(max(x, minX), minX + width)
                  let dy = y - min(max(y, minY), minY + height)
                  return dx * dx + dy * dy <= radius * radius
              }
          
              static func center(previous: Double?, randomUnit: Double, gap: Double,
                                 floor: Double, ceiling: Double, scale: Double) -> Double {
                  let low = floor + gap / 2 + 48 * scale
                  let high = ceiling - gap / 2 - 48 * scale
                  guard high >= low else { return (floor + ceiling) / 2 }
                  let target = previous.map { $0 + (min(max(randomUnit, 0), 1) * 2 - 1) * 104 * scale }
                      ?? (floor + ceiling) / 2
                  return min(max(target, low), high)
              }
          }
          
          #if GAME_MATH_TESTS
          @main
          enum FlightMathSmokeTests {
              static func main() {
                  // The speed and opening stop changing, even after a very long run.
                  precondition(FlightMath.speed(score: -1) == FlightMath.speed(score: 0))
                  precondition(FlightMath.speed(score: 18) == FlightMath.speed(score: 100_000))
                  precondition(FlightMath.gap(score: 20) == FlightMath.gap(score: 100_000))
                  precondition(FlightMath.gap(score: 100_000) >= 160)
          
                  // Exact ballistic integration must not depend on rendering at 30 or 120 Hz.
                  func flight(step: Double) -> (Double, Double) {
                      var y = 300.0
                      var velocity = 350.0
                      for _ in 0..<Int((0.6 / step).rounded()) {
                          let next = FlightMath.integrate(y: y, velocity: velocity, dt: step, scale: 1)
                          y = next.y
                          velocity = next.velocity
                      }
                      return (y, velocity)
                  }
                  let lowFPS = flight(step: 1 / 30)
                  let highFPS = flight(step: 1 / 120)
                  precondition(abs(lowFPS.0 - highFPS.0) < 0.000_001)
                  precondition(abs(lowFPS.1 - highFPS.1) < 0.000_001)
                  precondition(abs(lowFPS.0 - 330) < 0.000_001)
          
                  // Real circle/rectangle corners: a nearby corner is not automatically a hit.
                  precondition(FlightMath.circleHitsRect(x: 5, y: 5, radius: 1, minX: 0, minY: 0, width: 10, height: 10))
                  precondition(FlightMath.circleHitsRect(x: 12, y: 5, radius: 2, minX: 0, minY: 0, width: 10, height: 10))
                  precondition(!FlightMath.circleHitsRect(x: 12, y: 12, radius: 2, minX: 0, minY: 0, width: 10, height: 10))
                  precondition(!FlightMath.circleHitsRect(x: 0, y: 0, radius: 2, minX: 0, minY: 0, width: 0, height: 0))
          
                  // Thousands of deterministic extreme samples stay reachable and on screen.
                  for scale in [0.8, 1.0, 1.6] {
                      let floor = 86 * scale
                      let ceiling = 740 * scale
                      var previous: Double? = nil
                      for score in 0..<2_000 {
                          let gap = FlightMath.gap(score: score) * scale
                          let random = Double((score * 73) % 101) / 100
                          let next = FlightMath.center(previous: previous, randomUnit: random, gap: gap,
                                                       floor: floor, ceiling: ceiling, scale: scale)
                          precondition(next - gap / 2 >= floor + 48 * scale - 0.000_001)
                          precondition(next + gap / 2 <= ceiling - 48 * scale + 0.000_001)
                          if let previous = previous {
                              precondition(abs(next - previous) <= 104 * scale + 0.000_001)
                          }
                          previous = next
                      }
                  }
                  print("PASS: difficulty caps, frame-rate-independent flight, circle collisions, 6000 reachable openings")
              }
          }
          #else
          import SwiftUI
          import SpriteKit
          import UIKit
          
          @main
          struct HelloWindowsApp: App {
              var body: some Scene {
                  WindowGroup { ContentView() }
              }
          }
          
          enum FlightPhase: String {
              case ready, playing, paused, gameOver
          }
          
          final class FlightGame: ObservableObject {
              @Published private(set) var phase: FlightPhase = .ready
              @Published private(set) var score = 0
              @Published private(set) var best: Int
              let scene: FlightScene
          
              init() {
                  best = UserDefaults.standard.integer(forKey: "voa.bestScore.v1")
                  scene = FlightScene(size: CGSize(width: 390, height: 844))
                  scene.scaleMode = .resizeFill
                  scene.owner = self
              }
          
              func tap() {
                  switch phase {
                  case .ready: start()
                  case .playing: scene.flap()
                  case .paused, .gameOver: break
                  }
              }
          
              func start() {
                  score = 0
                  phase = .playing
                  scene.begin()
                  scene.flap()
              }
          
              func pause() {
                  guard phase == .playing else { return }
                  phase = .paused
                  scene.resetClock()
              }
          
              func resume() {
                  guard phase == .paused else { return }
                  scene.resetClock()
                  phase = .playing
              }
          
              func scored() {
                  guard phase == .playing else { return }
                  score += 1
                  if score > best {
                      best = score
                      UserDefaults.standard.set(best, forKey: "voa.bestScore.v1")
                  }
                  UISelectionFeedbackGenerator().selectionChanged()
              }
          
              func crashed() {
                  guard phase == .playing else { return }
                  phase = .gameOver
                  UINotificationFeedbackGenerator().notificationOccurred(.warning)
              }
          }
          
          struct ContentView: View {
              @StateObject private var game = FlightGame()
              @Environment(\.scenePhase) private var appPhase
              private let ink = Color(red: 0.10, green: 0.27, blue: 0.31)
          
              var body: some View {
                  ZStack {
                      SpriteView(scene: game.scene, preferredFramesPerSecond: 60)
                          .ignoresSafeArea()
                          .allowsHitTesting(false)
          
                      Color.clear
                          .contentShape(Rectangle())
                          .ignoresSafeArea()
                          .onTapGesture { game.tap() }
                          .accessibilityElement()
                          .accessibilityLabel("Bater asas")
                          .accessibilityAddTraits(.isButton)
                          .accessibilityIdentifier("flap-game")
                          .accessibilityHidden(game.phase != .playing)
          
                      VStack {
                          header
                          Spacer()
                          if game.phase == .playing {
                              Text("TOQUE PARA BATER ASAS")
                                  .font(.system(size: 10, weight: .heavy, design: .rounded))
                                  .tracking(2)
                                  .foregroundStyle(ink.opacity(0.45))
                                  .padding(.bottom, 78)
                                  .allowsHitTesting(false)
                          }
                      }
                      .padding(.horizontal, 22)
                      .padding(.top, 12)
          
                      if game.phase == .ready { readyScreen }
                      if game.phase == .paused { pauseScreen }
                      if game.phase == .gameOver { gameOverScreen }
                  }
                  .foregroundStyle(ink)
                  .onChange(of: appPhase) { phase in
                      if phase != .active { game.pause() }
                  }
                  .preferredColorScheme(.light)
                  .statusBarHidden(false)
              }
          
              private var header: some View {
                  HStack(alignment: .top) {
                      Text("VOA!")
                          .font(.system(size: 19, weight: .black, design: .rounded))
                          .tracking(1)
                          .padding(.horizontal, 15)
                          .padding(.vertical, 11)
                          .background(.white.opacity(0.82), in: Capsule())
                          .accessibilityLabel("Estado do jogo")
                          .accessibilityValue(game.phase.rawValue)
                          .accessibilityIdentifier("flight-state")
                          .allowsHitTesting(false)
                      Spacer()
                      VStack(spacing: 0) {
                          Text("\(game.score)")
                              .font(.system(size: 42, weight: .black, design: .rounded))
                              .monospacedDigit()
                          Text("PONTOS")
                              .font(.system(size: 9, weight: .heavy, design: .rounded))
                              .tracking(2)
                      }
                      .accessibilityElement(children: .ignore)
                      .accessibilityLabel("Pontuação")
                      .accessibilityValue("\(game.score)")
                      .accessibilityIdentifier("flight-score")
                      .allowsHitTesting(false)
                      Spacer()
                      if game.phase == .playing {
                          Button { game.pause() } label: {
                              Image(systemName: "pause.fill")
                                  .font(.system(size: 17, weight: .black))
                                  .frame(width: 48, height: 45)
                                  .background(.white.opacity(0.82), in: Capsule())
                          }
                          .accessibilityLabel("Pausar")
                          .accessibilityIdentifier("pause-game")
                      } else {
                          Color.clear.frame(width: 48, height: 45).allowsHitTesting(false)
                      }
                  }
                  .buttonStyle(.plain)
              }
          
              private var readyScreen: some View {
                  VStack(spacing: 0) {
                      Spacer().frame(height: 106)
                      VStack(spacing: 10) {
                          Text("Um pequeno voo.\nUm grande desafio.")
                              .font(.system(size: 34, weight: .black, design: .rounded))
                              .multilineTextAlignment(.center)
                              .minimumScaleFactor(0.7)
                          Text("Passe entre os canos e vá mais longe.")
                              .font(.system(size: 14, weight: .medium, design: .rounded))
                              .foregroundStyle(ink.opacity(0.65))
                      }
                      .allowsHitTesting(false)
                      Spacer()
                      VStack(spacing: 15) {
                          Label("Recorde: \(game.best)", systemImage: "trophy.fill")
                              .font(.system(size: 14, weight: .bold, design: .rounded))
                              .foregroundStyle(ink.opacity(0.75))
                              .allowsHitTesting(false)
                          actionButton("Vamos voar", symbol: "arrow.up", identifier: "start-game") { game.start() }
                          Text("Toque na tela para bater as asas")
                              .font(.system(size: 12, weight: .medium, design: .rounded))
                              .foregroundStyle(ink.opacity(0.65))
                              .allowsHitTesting(false)
                      }
                      .padding(.bottom, 92)
                  }
                  .padding(.horizontal, 28)
              }
          
              private var pauseScreen: some View {
                  modal {
                      Image(systemName: "pause.circle.fill")
                          .font(.system(size: 42, weight: .bold))
                          .foregroundStyle(Color(red: 0.13, green: 0.59, blue: 0.54))
                      Text("Uma pausa no voo")
                          .font(.system(size: 26, weight: .black, design: .rounded))
                      Text("Respire. Seu passarinho espera aqui.")
                          .font(.system(size: 14, weight: .medium, design: .rounded))
                          .foregroundStyle(ink.opacity(0.65))
                          .multilineTextAlignment(.center)
                      actionButton("Continuar", symbol: "play.fill", identifier: "resume-game") { game.resume() }
                      Button("Começar de novo") { game.start() }
                          .font(.system(size: 14, weight: .bold, design: .rounded))
                          .accessibilityIdentifier("restart-game")
                          .padding(.top, 4)
                  }
              }
          
              private var gameOverScreen: some View {
                  modal {
                      Text(game.score > 0 && game.score == game.best ? "QUE VOO BONITO!" : "SÓ MAIS UMA?")
                          .font(.system(size: 10, weight: .black, design: .rounded))
                          .tracking(2.5)
                          .foregroundStyle(Color(red: 0.13, green: 0.59, blue: 0.54))
                      Text("Fim de voo")
                          .font(.system(size: 34, weight: .black, design: .rounded))
                      HStack(spacing: 36) {
                          resultColumn("PONTOS", value: game.score)
                          Rectangle().fill(ink.opacity(0.12)).frame(width: 1, height: 48)
                          resultColumn("RECORDE", value: game.best)
                      }
                      .padding(.vertical, 8)
                      actionButton("Voar de novo", symbol: "arrow.clockwise", identifier: "restart-game") { game.start() }
                      Text("Cada toque dá um novo impulso.")
                          .font(.system(size: 12, weight: .medium, design: .rounded))
                          .foregroundStyle(ink.opacity(0.6))
                  }
              }
          
              private func resultColumn(_ title: String, value: Int) -> some View {
                  VStack(spacing: 5) {
                      Text("\(value)")
                          .font(.system(size: 36, weight: .black, design: .rounded))
                          .monospacedDigit()
                      Text(title)
                          .font(.system(size: 9, weight: .heavy, design: .rounded))
                          .tracking(1.5)
                  }
                  .accessibilityElement(children: .combine)
              }
          
              private func actionButton(_ title: String, symbol: String, identifier: String,
                                        action: @escaping () -> Void) -> some View {
                  Button(action: action) {
                      HStack(spacing: 12) {
                          Text(title)
                          Image(systemName: symbol)
                      }
                      .font(.system(size: 17, weight: .heavy, design: .rounded))
                      .foregroundStyle(.white)
                      .frame(maxWidth: .infinity)
                      .padding(.vertical, 19)
                      .background(Color(red: 0.10, green: 0.44, blue: 0.42), in: RoundedRectangle(cornerRadius: 23))
                      .overlay(RoundedRectangle(cornerRadius: 23).stroke(.white.opacity(0.24), lineWidth: 1))
                      .shadow(color: ink.opacity(0.17), radius: 0, x: 0, y: 5)
                  }
                  .buttonStyle(.plain)
                  .accessibilityIdentifier(identifier)
                  .frame(maxWidth: 310)
              }
          
              private func modal<Content: View>(@ViewBuilder content: () -> Content) -> some View {
                  ZStack {
                      Color(red: 0.05, green: 0.22, blue: 0.25).opacity(0.28)
                          .ignoresSafeArea()
                          .contentShape(Rectangle())
                      VStack(spacing: 18, content: content)
                          .padding(28)
                          .frame(maxWidth: 350)
                          .background(Color(red: 1, green: 0.99, blue: 0.93), in: RoundedRectangle(cornerRadius: 32))
                          .overlay(RoundedRectangle(cornerRadius: 32).stroke(.white.opacity(0.9), lineWidth: 2))
                          .shadow(color: ink.opacity(0.16), radius: 28, x: 0, y: 16)
                          .padding(24)
                  }
              }
          }
          
          private final class PipePair {
              let node = SKNode()
              var x: CGFloat
              var center: CGFloat
              var gap: CGFloat
              var scored = false
          
              init(x: CGFloat, center: CGFloat, gap: CGFloat) {
                  self.x = x
                  self.center = center
                  self.gap = gap
              }
          }
          
          final class FlightScene: SKScene {
              weak var owner: FlightGame?
              private let backdrop = SKNode()
              private let obstacles = SKNode()
              private let ground = SKNode()
              private let bird = SKNode()
              private let wing = SKNode()
              private var pipes: [PipePair] = []
              private var clouds: [(node: SKNode, speed: CGFloat)] = []
              private var groundMarks: [SKShapeNode] = []
              private var configured = false
              private var lastTime: TimeInterval?
              private var idleTime: TimeInterval = 0
              private var travel: CGFloat = 0
              private var spawnTravel: CGFloat = 0
              private var lastCenter: CGFloat?
              private var birdY: CGFloat = 0
              private var velocity: CGFloat = 0
              private let gameplayTimeScale: Double = {
                  #if DEBUG
                  // UI automation needs time to query controls; release physics is untouched.
                  return ProcessInfo.processInfo.arguments.contains("--ui-smoke-test") ? 0.1 : 1
                  #else
                  return 1
                  #endif
              }()
          
              private var unit: CGFloat { max(0.6, min(size.width / 390, size.height / 760)) }
              private var groundHeight: CGFloat { 86 * unit }
              private var ceiling: CGFloat { size.height - 105 * unit }
              private var birdX: CGFloat { min(size.width * 0.29, 190 * unit) }
              private var radius: CGFloat { 13 * unit }
              private var pipeWidth: CGFloat { 66 * unit }
              private var capWidth: CGFloat { 78 * unit }
          
              override func didMove(to view: SKView) {
                  if !configured {
                      configured = true
                      addChild(backdrop)
                      addChild(obstacles)
                      addChild(ground)
                      addChild(bird)
                      backdrop.zPosition = -10
                      obstacles.zPosition = 0
                      ground.zPosition = 5
                      bird.zPosition = 10
                      rebuildWorld()
                      setBirdToStart()
                  }
                  view.isMultipleTouchEnabled = false
                  resetClock()
              }
          
              override func didChangeSize(_ oldSize: CGSize) {
                  guard configured, oldSize.width > 0, oldSize.height > 0 else { return }
                  let ratioX = size.width / oldSize.width
                  let ratioY = size.height / oldSize.height
                  owner?.pause()
                  birdY *= ratioY
                  for pipe in pipes {
                      pipe.x *= ratioX
                      pipe.center *= ratioY
                      pipe.gap *= ratioY
                  }
                  if let lastCenter = lastCenter { self.lastCenter = lastCenter * ratioY }
                  rebuildWorld()
                  for pipe in pipes { drawPipe(pipe) }
                  bird.position = CGPoint(x: birdX, y: birdY)
                  if owner?.phase == .ready { setBirdToStart() }
                  resetClock()
              }
          
              func resetClock() { lastTime = nil }
          
              func begin() {
                  pipes.forEach { $0.node.removeFromParent() }
                  pipes.removeAll()
                  obstacles.removeAllActions()
                  travel = 0
                  spawnTravel = 0
                  lastCenter = nil
                  bird.removeAllActions()
                  wing.removeAllActions()
                  setBirdToStart()
                  addPipe()
                  resetClock()
              }
          
              func flap() {
                  velocity = 350 * unit
                  wing.removeAllActions()
                  wing.run(.sequence([
                      .rotate(toAngle: -0.65, duration: 0.07, shortestUnitArc: true),
                      .rotate(toAngle: 0.15, duration: 0.17, shortestUnitArc: true)
                  ]))
                  UIImpactFeedbackGenerator(style: .soft).impactOccurred(intensity: 0.45)
              }
          
              override func update(_ currentTime: TimeInterval) {
                  guard configured else { return }
                  guard let previous = lastTime else {
                      lastTime = currentTime
                      return
                  }
                  lastTime = currentTime
                  let elapsed = min(max(currentTime - previous, 0), 0.05)
                  guard elapsed > 0 else { return }
          
                  if owner?.phase == .ready {
                      idleTime += elapsed
                      bird.position.y = birdY + CGFloat(sin(idleTime * 2.5)) * 7 * unit
                      bird.zRotation = CGFloat(sin(idleTime * 2)) * 0.045
                      wing.zRotation = CGFloat(sin(idleTime * 5)) * 0.17
                      animateLandscape(dt: elapsed, speed: 26 * unit)
                      return
                  }
                  guard owner?.phase == .playing else { return }
          
                  // Small physics steps avoid tunnelling and discard large app-resume deltas.
                  let gameplayElapsed = elapsed * gameplayTimeScale
                  let steps = max(1, Int(ceil(gameplayElapsed / (1.0 / 120))))
                  let dt = gameplayElapsed / Double(steps)
                  for _ in 0..<steps {
                      guard owner?.phase == .playing else { break }
                      advance(dt: dt)
                  }
              }
          
              private func advance(dt: Double) {
                  let currentScore = owner?.score ?? 0
                  let distance = CGFloat(FlightMath.speed(score: currentScore)) * unit * CGFloat(dt)
                  let next = FlightMath.integrate(y: Double(birdY), velocity: Double(velocity), dt: dt, scale: Double(unit))
                  birdY = CGFloat(next.y)
                  velocity = CGFloat(next.velocity)
                  if birdY > size.height - 24 * unit {
                      birdY = size.height - 24 * unit
                      velocity = min(velocity, 0)
                  }
                  bird.position = CGPoint(x: birdX, y: birdY)
                  let targetRotation = min(0.45, max(-1.12, velocity / (650 * unit)))
                  bird.zRotation += (targetRotation - bird.zRotation) * min(1, CGFloat(dt) * 11)
          
                  spawnTravel += distance
                  if spawnTravel >= 238 * unit {
                      spawnTravel -= 238 * unit
                      addPipe()
                  }
                  for pipe in pipes {
                      pipe.x -= distance
                      pipe.node.position.x = pipe.x
                  }
          
                  if birdY - radius <= groundHeight {
                      birdY = groundHeight + radius
                      bird.position.y = birdY
                      crash()
                      return
                  }
                  for pipe in pipes {
                      if collides(with: pipe) {
                          crash()
                          return
                      }
                      if !pipe.scored, pipe.x + capWidth / 2 < birdX - radius {
                          pipe.scored = true
                          owner?.scored()
                          bird.run(.sequence([.scale(to: 1.08, duration: 0.07), .scale(to: 1, duration: 0.12)]), withKey: "score-pop")
                      }
                  }
                  pipes.removeAll { pipe in
                      if pipe.x + capWidth / 2 < -10 * unit {
                          pipe.node.removeFromParent()
                          return true
                      }
                      return false
                  }
                  animateLandscape(dt: dt, speed: distance / CGFloat(dt))
              }
          
              private func setBirdToStart() {
                  birdY = groundHeight + (ceiling - groundHeight) * 0.52
                  velocity = 0
                  bird.position = CGPoint(x: birdX, y: birdY)
                  bird.zRotation = 0
                  bird.setScale(1)
                  bird.alpha = 1
              }
          
              private func addPipe() {
                  let gap = CGFloat(FlightMath.gap(score: owner?.score ?? 0)) * unit
                  let center = CGFloat(FlightMath.center(previous: lastCenter.map(Double.init), randomUnit: Double.random(in: 0...1),
                                                        gap: Double(gap), floor: Double(groundHeight),
                                                        ceiling: Double(ceiling), scale: Double(unit)))
                  lastCenter = center
                  let pipe = PipePair(x: size.width + capWidth, center: center, gap: gap)
                  pipes.append(pipe)
                  obstacles.addChild(pipe.node)
                  drawPipe(pipe)
              }
          
              private func drawPipe(_ pipe: PipePair) {
                  pipe.node.removeAllChildren()
                  pipe.node.position = CGPoint(x: pipe.x, y: 0)
                  let lowerTop = pipe.center - pipe.gap / 2
                  let upperBottom = pipe.center + pipe.gap / 2
                  let green = UIColor(red: 0.19, green: 0.67, blue: 0.56, alpha: 1)
                  let edge = UIColor(red: 0.10, green: 0.43, blue: 0.39, alpha: 1)
                  for rect in [CGRect(x: -pipeWidth / 2, y: groundHeight - 3, width: pipeWidth, height: max(1, lowerTop - groundHeight + 3)),
                               CGRect(x: -pipeWidth / 2, y: upperBottom, width: pipeWidth, height: max(1, size.height - upperBottom + 5))] {
                      let body = SKShapeNode(rect: rect, cornerRadius: 6 * unit)
                      body.fillColor = green
                      body.strokeColor = edge
                      body.lineWidth = 2.5 * unit
                      pipe.node.addChild(body)
                      let shine = SKShapeNode(rect: CGRect(x: rect.minX + 7 * unit, y: rect.minY + 2 * unit,
                                                          width: 8 * unit, height: max(1, rect.height - 4 * unit)), cornerRadius: 3 * unit)
                      shine.fillColor = UIColor.white.withAlphaComponent(0.16)
                      shine.strokeColor = .clear
                      pipe.node.addChild(shine)
                  }
                  for y in [lowerTop - 22 * unit, upperBottom] {
                      let cap = SKShapeNode(rect: CGRect(x: -capWidth / 2, y: y, width: capWidth, height: 22 * unit), cornerRadius: 6 * unit)
                      cap.fillColor = UIColor(red: 0.26, green: 0.74, blue: 0.62, alpha: 1)
                      cap.strokeColor = edge
                      cap.lineWidth = 2.5 * unit
                      pipe.node.addChild(cap)
                      let highlight = SKShapeNode(rect: CGRect(x: -capWidth / 2 + 7 * unit, y: y + 14 * unit, width: capWidth - 14 * unit, height: 3 * unit), cornerRadius: 1.5 * unit)
                      highlight.fillColor = .white.withAlphaComponent(0.3)
                      highlight.strokeColor = .clear
                      pipe.node.addChild(highlight)
                  }
              }
          
              private func collides(with pipe: PipePair) -> Bool {
                  guard abs(pipe.x - birdX) < capWidth / 2 + radius else { return false }
                  let lowerTop = pipe.center - pipe.gap / 2
                  let upperBottom = pipe.center + pipe.gap / 2
                  let rects = [
                      CGRect(x: pipe.x - pipeWidth / 2, y: groundHeight, width: pipeWidth, height: max(0, lowerTop - groundHeight)),
                      CGRect(x: pipe.x - capWidth / 2, y: lowerTop - 22 * unit, width: capWidth, height: 22 * unit),
                      CGRect(x: pipe.x - pipeWidth / 2, y: upperBottom, width: pipeWidth, height: max(0, size.height - upperBottom)),
                      CGRect(x: pipe.x - capWidth / 2, y: upperBottom, width: capWidth, height: 22 * unit)
                  ]
                  return rects.contains { rect in
                      FlightMath.circleHitsRect(x: Double(birdX), y: Double(birdY), radius: Double(radius),
                                                minX: Double(rect.minX), minY: Double(rect.minY),
                                                width: Double(rect.width), height: Double(rect.height))
                  }
              }
          
              private func crash() {
                  owner?.crashed()
                  bird.removeAction(forKey: "score-pop")
                  bird.setScale(1)
                  bird.run(.sequence([
                      .rotate(byAngle: -0.15, duration: 0.05),
                      .rotate(byAngle: 0.23, duration: 0.07),
                      .rotate(byAngle: -0.08, duration: 0.06)
                  ]))
              }
          
              private func rebuildWorld() {
                  backdrop.removeAllChildren()
                  ground.removeAllChildren()
                  bird.removeAllChildren()
                  wing.removeAllChildren()
                  clouds.removeAll()
                  groundMarks.removeAll()
          
                  let renderer = UIGraphicsImageRenderer(size: CGSize(width: 4, height: 256))
                  let sky = renderer.image { context in
                      let colors = [UIColor(red: 0.67, green: 0.88, blue: 0.94, alpha: 1).cgColor,
                                    UIColor(red: 0.93, green: 0.97, blue: 0.88, alpha: 1).cgColor] as CFArray
                      if let gradient = CGGradient(colorsSpace: CGColorSpaceCreateDeviceRGB(), colors: colors, locations: [0, 1]) {
                          context.cgContext.drawLinearGradient(gradient, start: .zero, end: CGPoint(x: 0, y: 256), options: [])
                      }
                  }
                  let skyNode = SKSpriteNode(texture: SKTexture(image: sky))
                  skyNode.size = size
                  skyNode.position = CGPoint(x: size.width / 2, y: size.height / 2)
                  backdrop.addChild(skyNode)
          
                  let sun = ellipse(width: 105 * unit, height: 105 * unit, color: UIColor(red: 1, green: 0.96, blue: 0.73, alpha: 0.65))
                  sun.position = CGPoint(x: size.width * 0.79, y: size.height * 0.77)
                  backdrop.addChild(sun)
                  for index in 0..<6 {
                      let cloud = SKNode()
                      let s = (index % 2 == 0 ? 1.0 : 0.72) * unit
                      for (x, y, width, height) in [(-25.0, 0.0, 49.0, 25.0), (0.0, 10.0, 58.0, 40.0), (29.0, 0.0, 51.0, 27.0)] {
                          let puff = ellipse(width: width * s, height: height * s, color: .white.withAlphaComponent(0.62))
                          puff.position = CGPoint(x: x * s, y: y * s)
                          cloud.addChild(puff)
                      }
                      cloud.position = CGPoint(x: CGFloat(index) * (size.width + 100 * unit) / 5 - 50 * unit,
                                               y: size.height * (index % 2 == 0 ? 0.75 : 0.88))
                      backdrop.addChild(cloud)
                      clouds.append((cloud, CGFloat(4 + index % 3) * unit))
                  }
                  for index in 0..<7 {
                      let width = (210 + CGFloat(index % 3) * 35) * unit
                      let hill = ellipse(width: width, height: (115 + CGFloat(index % 2) * 35) * unit,
                                         color: UIColor(red: 0.61 + CGFloat(index % 2) * 0.05, green: 0.83, blue: 0.71, alpha: 0.62))
                      hill.position = CGPoint(x: CGFloat(index) * size.width / 5 - 60 * unit, y: groundHeight - 10 * unit)
                      backdrop.addChild(hill)
                  }
                  let soil = SKShapeNode(rect: CGRect(x: 0, y: 0, width: size.width, height: groundHeight))
                  soil.fillColor = UIColor(red: 0.92, green: 0.80, blue: 0.59, alpha: 1)
                  soil.strokeColor = .clear
                  ground.addChild(soil)
                  let grass = SKShapeNode(rect: CGRect(x: 0, y: groundHeight - 13 * unit, width: size.width, height: 13 * unit))
                  grass.fillColor = UIColor(red: 0.46, green: 0.70, blue: 0.49, alpha: 1)
                  grass.strokeColor = .clear
                  ground.addChild(grass)
                  let lip = SKShapeNode(rect: CGRect(x: 0, y: groundHeight - 2 * unit, width: size.width, height: 3 * unit))
                  lip.fillColor = UIColor(red: 0.70, green: 0.85, blue: 0.56, alpha: 1)
                  lip.strokeColor = .clear
                  ground.addChild(lip)
                  for _ in 0..<Int(size.width / (34 * unit)) + 3 {
                      let mark = SKShapeNode(rect: CGRect(x: 0, y: groundHeight - 23 * unit, width: 16 * unit, height: 4 * unit), cornerRadius: 2 * unit)
                      mark.fillColor = UIColor(red: 0.76, green: 0.62, blue: 0.42, alpha: 0.45)
                      mark.strokeColor = .clear
                      ground.addChild(mark)
                      groundMarks.append(mark)
                  }
                  buildBird()
                  animateLandscape(dt: 0, speed: 0)
              }
          
              private func buildBird() {
                  let outline = UIColor(red: 0.61, green: 0.36, blue: 0.11, alpha: 1)
                  let tail = SKShapeNode(path: polygon([CGPoint(x: -18, y: -2), CGPoint(x: -33, y: 8), CGPoint(x: -29, y: -8)]))
                  tail.fillColor = UIColor(red: 0.96, green: 0.60, blue: 0.26, alpha: 1)
                  tail.strokeColor = outline
                  tail.lineWidth = 1.7
                  bird.addChild(tail)
                  let body = ellipse(width: 46, height: 37, color: UIColor(red: 1, green: 0.78, blue: 0.25, alpha: 1))
                  body.strokeColor = outline
                  body.lineWidth = 1.7
                  bird.addChild(body)
                  let belly = ellipse(width: 24, height: 20, color: UIColor(red: 1, green: 0.91, blue: 0.55, alpha: 1))
                  belly.position = CGPoint(x: 3, y: -6)
                  bird.addChild(belly)
                  let tuft = SKShapeNode(path: polygon([CGPoint(x: -5, y: 17), CGPoint(x: -10, y: 26), CGPoint(x: 0, y: 21), CGPoint(x: 6, y: 25), CGPoint(x: 7, y: 17)]))
                  tuft.fillColor = UIColor(red: 1, green: 0.78, blue: 0.25, alpha: 1)
                  tuft.strokeColor = outline
                  tuft.lineWidth = 1.5
                  bird.addChild(tuft)
                  let eye = ellipse(width: 15, height: 18, color: .white)
                  eye.position = CGPoint(x: 11, y: 6)
                  bird.addChild(eye)
                  let pupil = ellipse(width: 6, height: 9, color: UIColor(red: 0.14, green: 0.23, blue: 0.24, alpha: 1))
                  pupil.position = CGPoint(x: 14, y: 6)
                  bird.addChild(pupil)
                  let sparkle = ellipse(width: 2.5, height: 3.5, color: .white)
                  sparkle.position = CGPoint(x: 15, y: 8)
                  bird.addChild(sparkle)
                  let beak = SKShapeNode(path: polygon([CGPoint(x: 21, y: 0), CGPoint(x: 34, y: -2), CGPoint(x: 22, y: -8)]))
                  beak.fillColor = UIColor(red: 1, green: 0.48, blue: 0.23, alpha: 1)
                  beak.strokeColor = outline
                  beak.lineWidth = 1.5
                  bird.addChild(beak)
                  let cheek = ellipse(width: 9, height: 5, color: UIColor(red: 1, green: 0.49, blue: 0.31, alpha: 0.6))
                  cheek.position = CGPoint(x: 12, y: -6)
                  bird.addChild(cheek)
                  let feather = ellipse(width: 23, height: 14, color: UIColor(red: 0.96, green: 0.62, blue: 0.18, alpha: 1))
                  feather.position = CGPoint(x: -8, y: -4)
                  feather.strokeColor = outline.withAlphaComponent(0.65)
                  feather.lineWidth = 1.3
                  wing.addChild(feather)
                  bird.addChild(wing)
                  // The parent scale is reserved for score feedback, so scale the drawing once.
                  for child in bird.children { child.setScale(unit) }
              }
          
              private func animateLandscape(dt: TimeInterval, speed: CGFloat) {
                  for cloud in clouds {
                      cloud.node.position.x -= (cloud.speed + speed * 0.035) * CGFloat(dt)
                      if cloud.node.position.x < -90 * unit { cloud.node.position.x = size.width + 90 * unit }
                  }
                  travel += speed * CGFloat(dt)
                  let offset = travel.truncatingRemainder(dividingBy: 34 * unit)
                  for (index, mark) in groundMarks.enumerated() {
                      mark.position.x = CGFloat(index - 1) * 34 * unit - offset
                  }
              }
          
              private func ellipse(width: CGFloat, height: CGFloat, color: UIColor) -> SKShapeNode {
                  let shape = SKShapeNode(ellipseOf: CGSize(width: width, height: height))
                  shape.fillColor = color
                  shape.strokeColor = .clear
                  return shape
              }
          
              private func polygon(_ points: [CGPoint]) -> CGPath {
                  let path = CGMutablePath()
                  if let first = points.first {
                      path.move(to: first)
                      for point in points.dropFirst() { path.addLine(to: point) }
                      path.closeSubpath()
                  }
                  return path
              }
          }
