          # Voa!
          
          Jogo iOS nativo inspirado na mecânica de tocar para voar, feito em SwiftUI e SpriteKit. Arte vetorial original, sem downloads, anúncios ou conta dentro do jogo.
          
          Toque para voar, atravesse as aberturas, marque pontos e tente superar seu recorde. O jogo pausa quando você sai do aplicativo.
          
          ## Instalação
          
          Importe `Voa-unsigned.ipa` no AltStore Classic, usando o mesmo procedimento do Hello World. O identificador continua `com.demo.hellowindows`, e o nome na tela inicial passa a ser **Voa!**.
          
          ## Compilação
          
          O workflow usa macOS e Xcode no GitHub Actions. O código-fonte está incluído no próprio workflow, permitindo editar e recompilar pelo navegador do Windows. Este pacote também contém os arquivos separados para edição.
          
          O IPA é compilado para um iPhone real ARM64 e precisa ser assinado pelo AltStore antes da instalação. Os testes de interface são executados no simulador; o teste físico do jogo será feito no iPhone do usuário.
          VOA_FILE_5
      - name: Record macOS and Xcode
        run: |
          mkdir -p dist
          sw_vers | tee dist/build-environment.txt
          xcodebuild -version | tee -a dist/build-environment.txt
          xcrun --sdk iphoneos --show-sdk-version | tee -a dist/build-environment.txt
      - name: Verify game rules and generate project
        run: |
          set -o pipefail
          swiftc -D GAME_MATH_TESTS -parse-as-library HelloWindows/HelloWindowsApp.swift -o /tmp/voa-math
          /tmp/voa-math | tee dist/game-rules-tests.txt
          swift scripts/make_icon.swift
          brew install xcodegen
          xcodegen generate
      - name: Compile real iPhone application
        run: |
          set -o pipefail
          xcodebuild -project HelloWindows.xcodeproj \
            -scheme HelloWindows -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/HelloWindows.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" archive 2>&1 | tee dist/xcodebuild.log
      - name: Play smoke test on iPhone simulator
        run: |
          set -o pipefail
          xcrun simctl list devices available -j > build/simulators.json
          DEVICE_ID=$(python3 -c 'import json; d=json.load(open("build/simulators.json")); print(next(v["udid"] for k,vs in sorted(d["devices"].items(),reverse=True) if "iOS" in k for v in vs if "iPhone" in v["name"] and v.get("isAvailable",False)))')
          xcodebuild -project HelloWindows.xcodeproj -scheme HelloWindows \
            -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -resultBundlePath build/FlightUI.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee dist/simulator-tests.log
          xcrun xcresulttool export attachments --path build/FlightUI.xcresult --output-path build/screenshots
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          shots = sorted(Path('build/screenshots').rglob('*.png'))
          assert shots, 'No simulator screenshots exported'
          for i, shot in enumerate(shots[:8], 1):
              shutil.copy2(shot, f'dist/Voa-simulator-{i}.png')
          print(f'Exported {len(shots)} real simulator screenshots')
          PY
      - name: Package and inspect unsigned IPA
        run: |
          mkdir -p build/package/Payload
          cp -R build/HelloWindows.xcarchive/Products/Applications/HelloWindows.app build/package/Payload/
          cd build/package
          zip -r -q ../../dist/Voa-unsigned.ipa Payload
          cd ../..
          file build/package/Payload/HelloWindows.app/HelloWindows | tee dist/binary-inspection.txt
          xcrun lipo -archs build/package/Payload/HelloWindows.app/HelloWindows | tee -a dist/binary-inspection.txt
          python3 scripts/verify_ipa.py dist/Voa-unsigned.ipa > dist/verification.json
          shasum -a 256 dist/Voa-unsigned.ipa | tee dist/SHA256.txt
          zip -r -q dist/Voa-source.zip HelloWindows project.yml scripts UITests README.md .github/workflows/build-ios.yml
          {
            echo '### Voa! native game compiled and simulator tests passed'
            echo 'Import Voa-unsigned.ipa into AltStore Classic for personal signing.'
            echo "Commit: $GITHUB_SHA"
            echo '```'
            cat dist/build-environment.txt dist/binary-inspection.txt dist/game-rules-tests.txt dist/SHA256.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Voa-IPA-and-proof
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct game download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "voa-${GITHUB_RUN_NUMBER}" dist/* \
            --target "$GITHUB_SHA" \
            --title "Voa! - jogo iOS ${GITHUB_RUN_NUMBER}" \
            --notes "Jogo nativo original em SwiftUI e SpriteKit. Toque para voar, atravesse obstaculos e supere seu recorde. Compilado para iPhone ARM64; regras e interface verificadas no simulador. Importe Voa-unsigned.ipa no AltStore Classic para assinar, como no Hello World. Mesmo identificador do app anterior. Teste fisico do jogo ainda a realizar." \
            --prerelease
