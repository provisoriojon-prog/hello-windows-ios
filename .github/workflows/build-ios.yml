          import XCTest
          
          final class FlightUITests: XCTestCase {
              override func setUpWithError() throws {
                  continueAfterFailure = false
              }
          
              func testStartPauseBackgroundCollisionAndRestart() {
                  let app = XCUIApplication()
                  // Slow the Debug physics clock so XCTest's UI synchronization can't outrun a round.
                  // The Release IPA keeps the normal real-time clock.
                  app.launchArguments = ["--ui-smoke-test"]
                  app.launch()
                  let state = app.descendants(matching: .any).matching(identifier: "flight-state").firstMatch
                  XCTAssertTrue(state.waitForExistence(timeout: 10))
                  expect("ready", on: state)
                  capture("01-inicio", app: app)
          
                  app.buttons["start-game"].tap()
                  expect("playing", on: state)
                  app.buttons["pause-game"].tap()
                  expect("paused", on: state)
                  capture("02-pausa", app: app)
                  app.buttons["resume-game"].tap()
                  expect("playing", on: state)
          
                  XCUIDevice.shared.press(.home)
                  app.activate()
                  expect("paused", on: state)
                  app.buttons["resume-game"].tap()
                  expect("playing", on: state)
                  // With no further flaps, gravity must end the round, not leave it hanging.
                  expect("gameOver", on: state, timeout: 25)
                  capture("03-fim", app: app)
                  XCTAssertTrue(app.buttons["restart-game"].exists)
                  app.buttons["restart-game"].tap()
                  expect("playing", on: state)
                  capture("04-voando", app: app)
              }
          
              private func expect(_ value: String, on element: XCUIElement, timeout: TimeInterval = 5) {
                  let expectation = XCTNSPredicateExpectation(predicate: NSPredicate(format: "value == %@", value), object: element)
                  XCTAssertEqual(XCTWaiter.wait(for: [expectation], timeout: timeout), .completed,
                                 "Expected \(value), got \(String(describing: element.value))")
              }
          
              private func capture(_ name: String, app: XCUIApplication) {
                  let attachment = XCTAttachment(screenshot: app.screenshot())
                  attachment.name = name
                  attachment.lifetime = .keepAlways
                  add(attachment)
              }
          }
